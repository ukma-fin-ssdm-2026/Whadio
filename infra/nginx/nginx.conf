worker_processes auto;

error_log /var/log/nginx/error.log notice;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    server_tokens off;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    map $request_method $signin_limit_key {
        default "";
        POST $binary_remote_addr;
    }
    limit_req_zone $signin_limit_key zone=signin:10m rate=5r/m;

    upstream whadio_web {
        server web-proxy:3000;
        keepalive 16;
    }

    server {
        listen 8080 default_server;
        listen [::]:8080 default_server;
        return 308 https://$host$request_uri;
    }

    server {
        listen 8443 ssl default_server;
        listen [::]:8443 ssl default_server;
        ssl_certificate /run/secrets/tls_certificate;
        ssl_certificate_key /run/secrets/tls_private_key;
        ssl_protocols TLSv1.2 TLSv1.3;

        client_max_body_size 501m;
        limit_req_status 429;

        location = /api/v1/sessions {
            limit_req zone=signin burst=5 nodelay;
            proxy_pass http://whadio_web;
            include /etc/nginx/proxy_params;
        }

        location ~ ^/(api|mcp)(/|$) {
            proxy_http_version 1.1;
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_max_temp_file_size 0;
            proxy_pass http://whadio_web;
            include /etc/nginx/proxy_params;
        }

        location = /health {
            proxy_pass http://whadio_web;
            include /etc/nginx/proxy_params;
        }

        location ^~ /recordings/ {
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_max_temp_file_size 0;
            proxy_pass http://seaweedfs:8333;
            proxy_set_header Host $http_host;
        }

        location / {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /index.html;
        }
    }
}
