worker_processes auto;

error_log /var/log/nginx/error.log notice;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    server_tokens off;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request_method $uri $server_protocol" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    resolver 127.0.0.11 ipv6=off valid=30s;

    map $request_method $signin_limit_key {
        default "";
        POST $binary_remote_addr;
    }
    limit_req_zone $signin_limit_key zone=signin:10m rate=5r/m;

    upstream whadio_web {
        server web-proxy:3000;
        keepalive 16;
    }

    server {
        listen 8080 default_server;
        listen [::]:8080 default_server;
        return 308 https://$host$request_uri;
    }

    server {
        listen 8443 ssl default_server;
        listen [::]:8443 ssl default_server;
        ssl_certificate /run/secrets/tls_certificate;
        ssl_certificate_key /run/secrets/tls_private_key;
        ssl_protocols TLSv1.2 TLSv1.3;

        client_max_body_size 1m;
        limit_req_status 429;
        error_page 413 = @payload_too_large;
        error_page 429 = @rate_limited;

        location @payload_too_large {
            internal;
            default_type application/json;
            add_header X-Request-ID $request_id always;
            return 413 '{"error":{"code":"PAYLOAD_TOO_LARGE","message":"Request body is too large","details":[],"request_id":"$request_id"}}';
        }

        location @rate_limited {
            internal;
            default_type application/json;
            add_header Retry-After 60 always;
            add_header X-Request-ID $request_id always;
            return 429 '{"error":{"code":"RATE_LIMITED","message":"Too many sign-in attempts; retry later","details":[],"request_id":"$request_id"}}';
        }

        location = /api/v1/sessions {
            limit_req zone=signin burst=5 nodelay;
            proxy_pass http://whadio_web;
            include /etc/nginx/proxy_params;
        }

        location ~ ^/api/v1/workspaces/[^/]+/meetings/?$ {
            client_max_body_size 501m;
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_max_temp_file_size 0;
            proxy_read_timeout 10m;
            proxy_pass http://whadio_web;
            include /etc/nginx/proxy_params;
        }

        location ~ ^/api/v1/captures/[^/]+/chunks/[^/]+/?$ {
            client_max_body_size 9m;
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_max_temp_file_size 0;
            proxy_read_timeout 2m;
            proxy_pass http://whadio_web;
            include /etc/nginx/proxy_params;
        }

        location ~ ^/mcp(/|$) {
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_max_temp_file_size 0;
            proxy_read_timeout 5m;
            proxy_pass http://whadio_web;
            include /etc/nginx/proxy_params;
        }

        location ~ ^/api(/|$) {
            proxy_pass http://whadio_web;
            include /etc/nginx/proxy_params;
        }

        location = /health {
            proxy_pass http://whadio_web;
            include /etc/nginx/proxy_params;
        }

        location ~ ^/[^/]+/recordings/ {
            access_log off;
            limit_except GET HEAD {
                deny all;
            }
            proxy_buffering off;
            proxy_max_temp_file_size 0;
            set $storage http://seaweedfs:8333;
            proxy_pass $storage;
            proxy_set_header Host $http_host;
            proxy_set_header Cookie "";
            proxy_set_header Authorization "";
        }

        location / {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /index.html;
        }
    }
}
