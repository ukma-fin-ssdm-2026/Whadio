[project]
name = "whadio"
version = "0.1.0"
description = "Whadio backend: meeting recording, transcription and notes"
readme = "README.md"
requires-python = ">=3.13,<3.15"
dependencies = [
    "aiosqlite>=0.21",
    "av>=19.0",
    "fastapi[standard]>=0.141",
    "fastmcp>=4.0.11",
    "pyyaml>=6.0",
    "sqlalchemy[asyncio]>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/api"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
