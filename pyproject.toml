[project]
name = "whadio"
version = "0.1.0"
description = "Whadio backend: meeting recording, transcription and notes"
readme = "README.md"
requires-python = ">=3.13,<3.15"
dependencies = [
    "fastapi[standard]>=0.141",
    "fastmcp>=4.0.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/api"]
