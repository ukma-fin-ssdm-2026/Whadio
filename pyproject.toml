[project]
name = "whadio"
version = "0.1.0"
description = "Whadio backend: meeting recording, transcription and notes"
readme = "README.md"
requires-python = ">=3.13,<3.15"
dependencies = [
    "av>=19.0",
    "fastapi[standard-no-fastapi-cloud-cli]>=0.142",
    "fastmcp>=4.0.11",
    "mcp>=2.3",
    "pydantic>=2.13",
    "pyyaml>=6.0",
    "starlette>=1.7",
    "typer>=0.27",
    "uvicorn>=0.54",
]

[project.scripts]
whadio = "whadio.cli:app"

[build-system]
requires = ["uv_build>=0.11.16,<0.12"]
build-backend = "uv_build"
