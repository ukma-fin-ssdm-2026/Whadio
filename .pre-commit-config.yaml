minimum_pre_commit_version: "4.4.0"
default_install_hook_types: [pre-commit, commit-msg, pre-push]
default_stages: [pre-commit]
fail_fast: true
# Generated coverage reports, committed for Lab 6.
exclude: ^htmlcov(-before)?/

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: no-commit-to-branch
        name: "branch is not main and is named <type>/#<issue>-<description>"
        args:
          - --branch=main
          - --pattern=^(?!(?:build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test)/#[1-9][0-9]*-[a-z0-9][a-z0-9-]*$)
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-illegal-windows-names
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: detect-private-key
      - id: mixed-line-ending
      - id: end-of-file-fixer
        exclude: \.svg$
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
        exclude: \.svg$

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
      # The hook above scans only the staged diff; CI and `task audit` scan the whole history.
      - id: gitleaks
        alias: gitleaks-history
        name: gitleaks (whole history)
        entry: gitleaks git --redact --verbose
        stages: [manual]

  # Python tools run from the project environment, so their versions come from uv.lock.
  - repo: local
    hooks:
      - id: commit-msg-format
        name: "commit message is <type>(#<issue>): <subject>"
        language: pygrep
        entry: '\A(?:(?:build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test)\(#[1-9][0-9]*\)!?: \S[^\n]*|build\(deps(?:-dev)?\): \S[^\n]*|Merge [^\n]+|(?:Revert|Reapply) "[^\n]+"|(?:fixup|squash|amend)! [^\n]+)'
        args: [--multiline, --negate]
        stages: [commit-msg]

      - id: uv-lock
        name: uv.lock matches pyproject.toml
        language: unsupported
        entry: uv lock --check
        files: ^(pyproject\.toml|uv\.lock)$
        pass_filenames: false

      - id: ruff-check
        name: ruff check --fix (whole project)
        entry: uv run --frozen ruff check --fix
        <<: &whole-project
          language: unsupported
          pass_filenames: false
          always_run: true
          require_serial: true

      - id: ruff-format
        name: ruff format (whole project)
        entry: uv run --frozen ruff format
        <<: *whole-project

      - id: biome
        name: biome check --write (frontend)
        language: unsupported
        # No shell wrapper: Windows has no sh outside Git Bash, while pre-commit resolves npm.cmd.
        entry: npm --prefix frontend run check:fix
        files: ^frontend/
        pass_filenames: false
        require_serial: true

      - id: biome-extension
        name: biome check --write (extension)
        language: unsupported
        # Biome comes from frontend/node_modules; the script runs it from extension/, whose config
        # extends the frontend's.
        entry: npm --prefix frontend run check:extension:fix
        # The frontend's Biome config and version decide the extension's result too.
        files: ^(extension/|frontend/biome\.jsonc$|frontend/package\.json$)
        pass_filenames: false
        require_serial: true

      - id: frontend-typecheck
        name: tsc (frontend)
        language: unsupported
        entry: npm --prefix frontend run typecheck
        files: ^frontend/
        pass_filenames: false

      - id: frontend-test
        name: vitest (frontend)
        language: unsupported
        entry: npm --prefix frontend test
        files: ^frontend/
        pass_filenames: false

      - id: no-suppressions
        name: no inline suppression comments (configure exceptions in pyproject.toml or biome.jsonc)
        language: pygrep
        entry: '#\s*(?:type:\s*ignore|pyright:\s*(?:ignore|basic)|ty:\s*ignore|noqa|nosec|ruff:\s*(?:noqa|ignore))|biome-ignore|@ts-ignore|@ts-expect-error|@ts-nocheck'
        types_or: [python, pyi, javascript, jsx, ts, tsx, css]

      - id: typos
        name: typos
        language: unsupported
        entry: uv run --frozen typos --force-exclude
        types: [text]

      - id: compose-schema
        name: compose.yaml follows the Compose specification
        language: unsupported
        entry: uv run --frozen check-jsonschema --builtin-schema vendor.compose-spec
        files: ^compose\.yaml$

      - id: dependabot-schema
        name: dependabot.yml follows its schema
        language: unsupported
        entry: uv run --frozen check-jsonschema --builtin-schema vendor.dependabot
        files: ^\.github/dependabot\.yml$

      - id: actionlint
        name: actionlint
        language: unsupported
        entry: uv run --frozen actionlint
        files: ^\.github/workflows/

      - id: zizmor
        name: zizmor (GitHub Actions security)
        language: unsupported
        entry: uv run --frozen zizmor
        files: ^\.github/.*\.ya?ml$

      - id: import-linter
        name: import-linter (architecture contracts)
        entry: uv run --frozen lint-imports
        <<: *whole-project

      - id: ty
        name: ty
        entry: uv run --frozen ty check
        <<: *whole-project

      - id: basedpyright
        name: basedpyright
        entry: uv run --frozen basedpyright
        <<: *whole-project

      - id: bandit
        name: bandit
        entry: uv run --frozen bandit -c pyproject.toml -r src -q
        <<: *whole-project

      - id: deptry
        name: deptry (declared vs imported dependencies)
        entry: uv run --frozen deptry src
        <<: *whole-project

      - id: openapi
        name: docs/api specification matches the code
        language: unsupported
        entry: uv run --frozen whadio openapi
        files: ^(src/|docs/api/)
        pass_filenames: false

      - id: frontend-api-types
        name: frontend API types match the specification
        language: unsupported
        entry: npm --prefix frontend run gen:api
        files: ^(docs/api/openapi-generated\.json|frontend/)
        pass_filenames: false

      - id: pytest
        name: pytest (fast)
        entry: uv run --frozen pytest -q -m "not slow"
        <<: *whole-project

      - id: pytest-full
        name: pytest (full, with the coverage gate)
        entry: uv run --frozen task test:cov
        stages: [pre-push, manual]
        <<: *whole-project

      - id: uv-audit
        name: uv audit (known vulnerabilities)
        entry: uv audit --frozen
        stages: [manual]
        <<: *whole-project
