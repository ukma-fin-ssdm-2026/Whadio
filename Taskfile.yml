version: "3"

tasks:
  setup:
    desc: Install the dependencies and the git hooks
    cmds:
      - uv sync --locked --extra asr --extra cpu
      - task: frontend:install
      - uv run --frozen pre-commit install --install-hooks

  frontend:install:
    desc: Install the frontend's dependencies from its lockfile
    cmds:
      - npm ci --prefix frontend

  dev:
    desc: Run the API with auto-reload on http://localhost:3000
    env:
      # The container reaches Mailpit by service name; a host-run API uses its published port.
      WHADIO_SMTP__HOST: 127.0.0.1
    cmds:
      - uv run --frozen fastapi dev --entrypoint whadio.api.main:app --port 3000

  fix:
    desc: Apply ruff's and Biome's fixes and formatting to the whole project
    cmds:
      - uv run --frozen ruff check --fix
      - uv run --frozen ruff format
      - npm --prefix frontend run check:fix
      - npm --prefix frontend run check:extension:fix

  check:
    desc: Run every static check on all files, as CI does
    cmds:
      - uv run --frozen pre-commit run --all-files --hook-stage manual --show-diff-on-failure

  ci:
    desc: Run every CI job in parallel and to the end; needs what `task test:cov` needs, and Docker
    cmds:
      - "{{.TASK_EXE}} --output=prefixed ci:jobs"

  ci:jobs:
    deps:
      - check
      - audit
      - frontend:typecheck
      - frontend:test
      - frontend:build
      - test:cov
      - image

  test:
    desc: Run the whole test suite, slow tests and the frontend's tests included
    cmds:
      - uv run --frozen pytest {{.CLI_ARGS}}
      - task: frontend:test

  frontend:test:
    desc: Run the frontend's tests
    cmds:
      - npm --prefix frontend test

  frontend:typecheck:
    desc: Check the frontend's types
    cmds:
      - npm --prefix frontend run typecheck

  frontend:build:
    desc: Build the frontend
    cmds:
      - npm --prefix frontend run build

  test:fast:
    desc: Run the tests that need no services, as the push hook does; CI runs the whole suite
    cmds:
      # Importing these two modules loads torch: longer than running all the other tests.
      - >-
        uv run --frozen pytest -q -m "not slow"
        --ignore=src/whadio/workers/asr/diarization/test_pyannote.py
        --ignore=src/whadio/workers/asr/recognition/test_whisper.py
        {{.CLI_ARGS}}

  test:cov:
    desc: Run the suite CI runs, with the line and branch coverage gate from pyproject.toml
    preconditions:
      - sh: test -n "$WHADIO_TEST_DATABASE_URL"
        msg: >-
          Set WHADIO_TEST_DATABASE_URL to the test database (start it with `task infra:up`); see
          docs/testing/testing.md
    cmds:
      # `--cov` takes an optional source, so it goes last or it swallows a forwarded test path.
      - uv run --frozen pytest -m "not models" {{.CLI_ARGS}} --cov

  mutation:
    desc: Mutation-test the notes prompt with mutmut and list the mutants the tests let survive
    cmds:
      # mutmut keeps a mutant's cached verdict when only the tests change; start from scratch.
      - rm -rf mutants
      - uv run --frozen mutmut run
      - uv run --frozen mutmut results

  audit:
    desc: Warn about vulnerable dependencies
    cmds:
      # A warning: a new advisory would otherwise fail pull requests that changed no dependency.
      - uv audit --frozen || echo "::warning title=uv audit::Vulnerable Python dependencies"
      - >-
        npm audit --prefix frontend --audit-level=high ||
        echo "::warning title=npm audit::Vulnerable frontend dependencies"

  image:
    desc: Build the worker image and run its entry point
    cmds:
      - defer: docker image rm --force whadio:check > /dev/null
      # Only the CPU variant: TORCH=cuda adds about 3.5 GB of CUDA wheels to every cold build.
      - docker build --build-arg TORCH=cpu --tag whadio:check .
      - docker run --rm whadio:check --help

  openapi:
    desc: Regenerate docs/api/openapi-generated.yaml and .json
    cmds:
      - uv run --frozen whadio openapi

  db:upgrade:
    desc: Apply the packaged database migrations using the owner role
    cmds:
      - uv run --frozen whadio db-upgrade

  infra:up:
    desc: Start PostgreSQL, RabbitMQ, SeaweedFS and Mailpit, and wait until they are healthy
    preconditions:
      - sh: test -f .env
        msg: Copy .env.example to .env first
    cmds:
      - docker compose up --detach --wait postgres rabbitmq seaweedfs mailpit

  infra:down:
    desc: Stop the services and the workers, and keep their data
    cmds:
      - docker compose --profile core --profile gpu --profile ollama --profile dev down

  infra:reset:
    desc: Stop the services and the workers, and delete their data
    prompt: This deletes the local database, broker and storage data, and the downloaded models. Continue?
    cmds:
      - docker compose --profile core --profile gpu --profile ollama --profile dev down --volumes

  infra:logs:
    desc: Follow the services' logs
    cmds:
      - docker compose logs --follow {{.CLI_ARGS}}

  workers:up:
    desc: Build and start the notes and ASR workers; the first start downloads the models
    preconditions:
      - sh: test -f .env
        msg: Copy .env.example to .env first
    cmds:
      - docker compose --profile core --profile gpu up --detach --build notes-worker asr-worker

  workers:down:
    desc: Stop the notes and ASR workers
    cmds:
      - docker compose --profile core --profile gpu stop notes-worker asr-worker

  workers:logs:
    desc: Follow the workers' logs
    cmds:
      - docker compose --profile core --profile gpu logs --follow notes-worker asr-worker

  llm:up:
    desc: Start Ollama on the GPU and pull the notes model from .env; the first pull takes a while
    preconditions:
      - sh: test -f .env
        msg: Copy .env.example to .env first
    cmds:
      - docker compose --profile ollama up --detach --wait llm-runtime
      # `up --wait` returns once the one-shot pull is running, not when it has finished.
      - docker compose --profile ollama run --rm llm-pull

  llm:logs:
    desc: Follow the Ollama runtime's logs
    cmds:
      - docker compose --profile ollama logs --follow llm-runtime
