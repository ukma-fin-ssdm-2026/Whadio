                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/captures/{capture_id}/chunks/{seq}:
    put:
      tags:
      - capture
      summary: Upload one chunk
      description: Multipart with the `audio` part (`audio/*`) and `speaker_events`,
        a JSON list of the participants seen speaking during the chunk. Uploading
        the same chunk again changes nothing.
      operationId: put_chunk_api_v1_captures__capture_id__chunks__seq__put
      security:
      - sessionCookie: []
      - extensionToken: []
      parameters:
      - name: capture_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          description: Capture identifier
          examples:
          - 3c2b1a09-8f7e-4d6c-b5a4-93827160f5e4
          title: Capture Id
        description: Capture identifier
      - name: seq
        in: path
        required: true
        schema:
          type: integer
          maximum: 1000000
          minimum: 0
          description: Chunk number, from 0 in recording order
          title: Seq
        description: Chunk number, from 0 in recording order
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_put_chunk_api_v1_captures__capture_id__chunks__seq__put'
      responses:
        '201':
          description: The chunk was stored
          content:
            application/json:
              schema: {}
        '200':
          description: The same chunk was already stored
        '401':
          description: '`UNAUTHENTICATED`: the session is missing, expired or ended'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: '`NOT_FOUND`: no such capture, or another account opened it'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: '`CHUNK_MISMATCH`: different audio is already stored under
            this number; `CAPTURE_CLOSED`: the capture was completed or finalised'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: '`PAYLOAD_TOO_LARGE`: the chunk exceeds `max_chunk_bytes`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '415':
          description: '`UNSUPPORTED_MEDIA_TYPE`: the part is not `audio/*`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: '`VALIDATION_ERROR`: a parameter or field is invalid; `details`
            names each; the chunk is empty or `speaker_events` is invalid'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/captures/{capture_id}/complete:
    post:
      tags:
      - capture
      summary: Finish recording
      description: Joins chunks `0..last_seq` into the recording and queues the meeting
        through the same path as an upload. Repeating it with the same `last_seq`
        returns the same result.
      operationId: complete_capture_api_v1_captures__capture_id__complete_post
      security:
      - sessionCookie: []
      - extensionToken: []
      parameters:
      - name: capture_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          description: Capture identifier
          examples:
          - 3c2b1a09-8f7e-4d6c-b5a4-93827160f5e4
          title: Capture Id
        description: Capture identifier
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CaptureComplete'
      responses:
        '200':
          description: The assembled capture
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaptureRead'
        '400':
          description: '`MALFORMED_REQUEST`: the body, or a JSON field in it, is not
            valid JSON'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: '`UNAUTHENTICATED`: the session is missing, expired or ended'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: '`NOT_FOUND`: no such capture, or another account opened it'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: '`MISSING_CHUNKS`: numbers below `last_seq` never arrived,
            listed in `details`; `EMPTY_CAPTURE`: no chunk arrived; `CAPTURE_CLOSED`:
            already finalised with a different `last_seq`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: '`VALIDATION_ERROR`: a parameter or field is invalid; `details`
            names each'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: '`INTEGRATION_UNAVAILABLE`: storage or the job queue is unavailable'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
