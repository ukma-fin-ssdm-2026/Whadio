  /api/v1/captures:
    post:
      tags:
      - capture
      summary: Start recording
      description: Opens a capture and creates its meeting in state `recording`. `consent_confirmed`
        must be `true`, and the confirmation is stored with the meeting. Without a
        destination the meeting goes to the default folder of the caller's personal
        workspace.
      operationId: start_capture_api_v1_captures_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CaptureCreate'
        required: true
      responses:
        '201':
          description: The open capture
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaptureRead'
        '400':
          description: '`MALFORMED_REQUEST`: the body, or a JSON field in it, is not
            valid JSON'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: '`UNAUTHENTICATED`: the session is missing, expired or ended'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: '`NOT_FOUND`: no such workspace, or the caller is not a member'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: '`VALIDATION_ERROR`: a parameter or field is invalid; `details`
            names each; `consent_confirmed` must be `true`, and `folder_id` must be
            a folder of the workspace'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - sessionCookie: []
      - extensionToken: []
