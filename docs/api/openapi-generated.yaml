          anyOf:
          - type: number
          - type: 'null'
          title: Running Seconds
          description: Current attempt running time; null outside running state
        last_queue_wait_seconds:
          anyOf:
          - type: number
          - type: 'null'
          title: Last Queue Wait Seconds
          description: Wait preceding the started attempt, when known
        last_attempt_duration_seconds:
          anyOf:
          - type: number
          - type: 'null'
          title: Last Attempt Duration Seconds
          description: Final attempt duration for a terminal started job
        total_elapsed_seconds:
          type: number
          title: Total Elapsed Seconds
          description: Logical-job age including all waits/retries, frozen at completion
        failure_code:
          anyOf:
          - type: string
          - type: 'null'
          title: Failure Code
          description: Allowlisted failure code; no raw exception or provider text
        failure_description:
          anyOf:
          - type: string
          - type: 'null'
          title: Failure Description
          description: Fixed safe explanation of the failure
        timing_anomaly:
          type: boolean
          title: Timing Anomaly
          description: A clock-skew duration was bounded at zero
      type: object
      required:
      - job_id
      - workspace_id
      - job_type
      - status
      - created_at
      - queued_at
      - started_at
      - finished_at
      - attempts_started
      - as_of
      - queue_wait_seconds
      - running_seconds
      - last_queue_wait_seconds
      - last_attempt_duration_seconds
      - total_elapsed_seconds
      - failure_code
      - failure_description
      - timing_anomaly
      title: JobSnapshot
