openapi: 3.1.0
info:
  title: Whadio API
  description: |-
    Whadio records Google Meet calls from the browser, transcribes them with speaker labels and
    writes notes, inside workspaces with roles, restrictions and sharing.

    Sign-in, workspaces, meeting content, folders, glossary, revisions, restrictions and shares are
    stored in PostgreSQL. Requests need a stored, unexpired session; MCP needs a stored personal key.
    An upload is stored in object storage and queued for transcription and notes, which the workers
    run.

    Notes regeneration is not built yet: it returns `503 INTEGRATION_UNAVAILABLE`, as does an upload
    on a server without a broker or object storage. A share access request reserves an email to the
    share's creator with the request; the scheduler sends it when an SMTP relay is configured. The API
    contract is in `docs/api/api-design.md`.

    ## Conventions
    - **Errors:** every 4xx and 5xx body is `{"error": {"code", "message", "details",
      "request_id"}}`. Branch on `code`; `request_id` equals the `X-Request-ID` response header.
    - **Lists:** `limit` (1-100, default 20) and `cursor`; responses are
      `{"items": [...], "pagination": {"limit", "next_cursor", "has_more"}}`.
    - **Visibility:** a resource the caller cannot see is `404`, never `403`, so its existence does
      not leak. `403` means the caller can see it but their role does not allow the action.
    - **Time:** ISO 8601 with an offset; returned in UTC.
  version: 0.1.0
paths:
  /api/v1/instance:
    get:
      tags:
      - accounts
      summary: Describe this instance
      description: Public. Returns the registration mode and API version so the web
        app can decide whether to offer registration and password reset.
      operationId: instance_api_v1_instance_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstanceRead'
      security: []
  /api/v1/registrations/{registration_id}/complete:
    post:
      tags:
      - accounts
      summary: Create the account from a registration link
      description: Works in either registration mode. Creates the account and its
        personal workspace atomically, consumes the link, and sets the browser session
        cookie.
      operationId: complete_api_v1_registrations__registration_id__complete_post
      parameters:
      - name: registration_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          description: Registration identifier from the link
          title: Registration Id
        description: Registration identifier from the link
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistrationComplete'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserRead'
        '400':
          description: '`MALFORMED_REQUEST`: the body, or a JSON field in it, is not
            valid JSON'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 'LINK_INVALID: unknown, expired, replaced or used link'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: '`VALIDATION_ERROR`: a parameter or field is invalid; `details`
            names each'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security: []
  /api/v1/password-resets/{reset_id}/complete:
    post:
      tags:
      - accounts
      summary: Set a new password from a reset link
      description: Public in either registration mode. Consumes the single-use link,
        changes the password and ends every browser and extension session atomically.
        MCP keys remain active.
      operationId: complete_api_v1_password_resets__reset_id__complete_post
      parameters:
      - name: reset_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          description: Password-reset identifier from the link
          title: Reset Id
        description: Password-reset identifier from the link
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetComplete'
      responses:
        '204':
          description: Password changed; sign in again with the new password
        '400':
          description: '`MALFORMED_REQUEST`: the body, or a JSON field in it, is not
            valid JSON'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 'LINK_INVALID: unknown, expired, replaced or used link'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: '`VALIDATION_ERROR`: a parameter or field is invalid; `details`
            names each'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security: []
  /api/v1/sessions:
    post:
      tags:
      - accounts
      summary: Sign in
      description: 'Public. With `kind: browser` (the default) sets an HttpOnly, SameSite=Strict
        session cookie valid for 14 days. With `kind: extension` returns a bearer
        token, shown once and valid for 24 hours, that only the capture endpoints
        accept. Neither is extended by use. A failure never says which credential
        was wrong.'
      operationId: sign_in_api_v1_sessions_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignIn'
        required: true
      responses:
        '201':
          description: The session that was started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionRead'
        '400':
          description: '`MALFORMED_REQUEST`: the body, or a JSON field in it, is not
            valid JSON'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: '`INVALID_CREDENTIALS`: unknown address or wrong password'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: '`VALIDATION_ERROR`: a parameter or field is invalid; `details`
            names each'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: '`RATE_LIMITED`: too many sign-in attempts from this address;
            `Retry-After` says how long to wait'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/sessions/current:
    delete:
      tags:
      - accounts
      summary: Sign out
      description: 'Ends the sessions presented by the cookie and by the extension''s
        bearer token, and clears the cookie. Always `204`, also without a session:
        signing out is idempotent.'
      operationId: sign_out_api_v1_sessions_current_delete
      responses:
        '204':
          description: Signed out
      security:
      - sessionCookie: []
      - extensionToken: []
  /api/v1/users/me:
    get:
      tags:
      - accounts
      summary: Get the signed-in user
      description: Returns the user behind the browser session cookie. The extension's
        bearer token is not accepted.
      operationId: get_signed_in_user_api_v1_users_me_get
      responses:
        '200':
          description: The signed-in user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserRead'
        '401':
          description: '`UNAUTHENTICATED`: the session is missing, expired or ended'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - sessionCookie: []
  /api/v1/users/me/mcp-keys:
    get:
      tags:
      - accounts
      summary: List my MCP keys
      description: Lists the caller's keys newest first, including revoked and expired
        keys. Secrets are never returned.
      operationId: list_mcp_keys_api_v1_users_me_mcp_keys_get
      security:
      - sessionCookie: []
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          description: Maximum number of items to return
          default: 20
          title: Limit
        description: Maximum number of items to return
      - name: cursor
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            minLength: 1
            maxLength: 4096
          - type: 'null'
          description: Opaque `next_cursor` from the previous page; omit for the first
            page
          title: Cursor
        description: Opaque `next_cursor` from the previous page; omit for the first
          page
      responses:
        '200':
          description: A page of personal MCP keys
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Page_McpKeyRead_'
        '401':
          description: '`UNAUTHENTICATED`: the session is missing, expired or ended'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: '`VALIDATION_ERROR`: a parameter or field is invalid; `details`
            names each'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags:
      - accounts
      summary: Create an MCP key
      description: Creates a personal key for AI assistants. The secret is shown once
        and only its SHA-256 hash is stored.
      operationId: create_mcp_key_api_v1_users_me_mcp_keys_post
      security:
      - sessionCookie: []
      requestBody:
        content:
          application/json:
            schema:
              anyOf:
              - $ref: '#/components/schemas/McpKeyCreate'
              - type: 'null'
              title: Payload
      responses:
        '201':
          description: The new key and its one-time secret
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/McpKeyCreated'
        '400':
          description: '`MALFORMED_REQUEST`: the body, or a JSON field in it, is not
            valid JSON'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: '`UNAUTHENTICATED`: the session is missing, expired or ended'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: '`VALIDATION_ERROR`: a parameter or field is invalid; `details`
            names each'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/users/me/mcp-keys/{key_id}:
    delete:
      tags:
      - accounts
      summary: Revoke an MCP key
      description: Revokes one of the caller's keys. Revoking an already revoked key
        is harmless.
      operationId: revoke_mcp_key_api_v1_users_me_mcp_keys__key_id__delete
      security:
      - sessionCookie: []
      parameters:
      - name: key_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          description: MCP key identifier
          title: Key Id
        description: MCP key identifier
      responses:
        '204':
          description: Key revoked
        '401':
          description: '`UNAUTHENTICATED`: the session is missing, expired or ended'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: '`NOT_FOUND`: no such key among the caller''s own'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/workspaces:
    get:
      tags:
      - workspaces
      summary: List my workspaces
      description: Workspaces the caller belongs to, oldest first, the personal one
        included.
      operationId: list_workspaces_api_v1_workspaces_get
      security:
      - sessionCookie: []
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          description: Maximum number of items to return
          default: 20
          title: Limit
        description: Maximum number of items to return
      - name: cursor
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            minLength: 1
            maxLength: 4096
          - type: 'null'
          description: Opaque `next_cursor` from the previous page; omit for the first
            page
          title: Cursor
        description: Opaque `next_cursor` from the previous page; omit for the first
          page
      responses:
        '200':
          description: A page of workspaces
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Page_WorkspaceSummary_'
        '401':
          description: '`UNAUTHENTICATED`: the session is missing, expired or ended'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: '`VALIDATION_ERROR`: a parameter or field is invalid; `details`
            names each'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags:
      - workspaces
      summary: Create a workspace
      description: Creates a workspace with the caller as its Owner, one default folder
        and no meetings.
      operationId: create_workspace_api_v1_workspaces_post
      security:
      - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkspaceCreate'
      responses:
        '201':
          description: The new workspace
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceRead'
          headers:
            Location:
              description: URL of the new workspace
              schema:
                type: string
                format: uri
        '400':
          description: '`MALFORMED_REQUEST`: the body, or a JSON field in it, is not
            valid JSON'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: '`UNAUTHENTICATED`: the session is missing, expired or ended'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: '`VALIDATION_ERROR`: a parameter or field is invalid; `details`
            names each'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/workspaces/{workspace_id}:
    get:
      tags:
      - workspaces
      summary: Get a workspace
      description: Any member. Includes the caller's role and where notes are generated.
      operationId: get_workspace_api_v1_workspaces__workspace_id__get
      security:
      - sessionCookie: []
      parameters:
      - name: workspace_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          description: Workspace identifier
          examples:
          - 7b1e9c40-2d3f-4a5b-8c6d-0e1f2a3b4c5d
          title: Workspace Id
        description: Workspace identifier
      responses:
        '200':
          description: The workspace
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceRead'
        '401':
          description: '`UNAUTHENTICATED`: the session is missing, expired or ended'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: '`NOT_FOUND`: no such workspace, or the caller is not a member'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: '`VALIDATION_ERROR`: a parameter or field is invalid; `details`
            names each'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      tags:
      - workspaces
      summary: Update workspace settings
      description: Owner only. Renames the workspace or changes its default notes
        preset; give at least one field.
      operationId: update_workspace_api_v1_workspaces__workspace_id__patch
      security:
      - sessionCookie: []
      parameters:
      - name: workspace_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          description: Workspace identifier
          examples:
          - 7b1e9c40-2d3f-4a5b-8c6d-0e1f2a3b4c5d
          title: Workspace Id
        description: Workspace identifier
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkspaceUpdate'
      responses:
        '200':
          description: The updated workspace
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceRead'
        '400':
          description: '`MALFORMED_REQUEST`: the body, or a JSON field in it, is not
            valid JSON'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: '`UNAUTHENTICATED`: the session is missing, expired or ended'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: '`INSUFFICIENT_ROLE`: only the Owner can do this'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: '`NOT_FOUND`: no such workspace, or the caller is not a member'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: '`VALIDATION_ERROR`: a parameter or field is invalid; `details`
            names each'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags:
      - workspaces
      summary: Delete a workspace
      description: Owner only. Deletes the workspace with its folders, meetings, recordings,
        transcripts and notes. A personal workspace cannot be deleted.
      operationId: delete_workspace_api_v1_workspaces__workspace_id__delete
      security:
      - sessionCookie: []
      parameters:
      - name: workspace_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          description: Workspace identifier
          examples:
          - 7b1e9c40-2d3f-4a5b-8c6d-0e1f2a3b4c5d
          title: Workspace Id
        description: Workspace identifier
      responses:
        '204':
          description: Deleted
        '401':
          description: '`UNAUTHENTICATED`: the session is missing, expired or ended'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: '`INSUFFICIENT_ROLE`: only the Owner can do this'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: '`NOT_FOUND`: no such workspace, or the caller is not a member'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: '`PERSONAL_WORKSPACE`: a personal workspace cannot be deleted'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: '`VALIDATION_ERROR`: a parameter or field is invalid; `details`
            names each'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/workspaces/{workspace_id}/meetings:
    get:
      tags:
      - meetings
      summary: List meetings
      description: Meetings the caller can read, newest recording first, with their
        processing state. Restricted meetings the caller was not selected for are
        left out. Filters combine; an empty page means nothing matched.
      operationId: list_meetings_api_v1_workspaces__workspace_id__meetings_get
      security:
      - sessionCookie: []
      parameters:
      - name: workspace_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          description: Workspace identifier
          examples:
          - 7b1e9c40-2d3f-4a5b-8c6d-0e1f2a3b4c5d
          title: Workspace Id
        description: Workspace identifier
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          description: Maximum number of items to return
          default: 20
          title: Limit
        description: Maximum number of items to return
      - name: cursor
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            minLength: 1
            maxLength: 4096
          - type: 'null'
          description: Opaque `next_cursor` from the previous page; omit for the first
            page
          title: Cursor
        description: Opaque `next_cursor` from the previous page; omit for the first
          page
      - name: folder_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          description: Only meetings in this folder
          title: Folder Id
        description: Only meetings in this folder
      - name: name
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            minLength: 1
            maxLength: 200
          - type: 'null'
          description: Case-insensitive part of the meeting name
          title: Name
        description: Case-insensitive part of the meeting name
      - name: recorded_from
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          description: Recorded at or after this instant (inclusive)
          title: Recorded From
        description: Recorded at or after this instant (inclusive)
      - name: recorded_to
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          description: Recorded before this instant (exclusive)
          title: Recorded To
        description: Recorded before this instant (exclusive)
      responses:
        '200':
          description: A page of meetings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Page_MeetingSummary_'
        '401':
          description: '`UNAUTHENTICATED`: the session is missing, expired or ended'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: '`NOT_FOUND`: no such workspace, or the caller is not a member'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: '`VALIDATION_ERROR`: a parameter or field is invalid; `details`
            names each'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags:
      - meetings
      summary: Upload a recording
      description: 'Any member. Multipart with the audio `file`, an optional `folder_id`
        and `name`. Supported formats: WAV, MP3, AAC, FLAC, Ogg, WebM or MP4/M4A.
        The server decodes the file to check, whatever its name or declared type;
        any other file is refused and creates no meeting. Without `name`, the meeting
        is named after its date and time until it is renamed. The meeting is queued
        for processing at once; its speakers will be labelled `Speaker 1`, `Speaker
        2` and so on.'
      operationId: upload_recording_api_v1_workspaces__workspace_id__meetings_post
      security:
      - sessionCookie: []
      - extensionToken: []
      parameters:
      - name: workspace_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          description: Workspace identifier
          examples:
          - 7b1e9c40-2d3f-4a5b-8c6d-0e1f2a3b4c5d
          title: Workspace Id
        description: Workspace identifier
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_upload_recording_api_v1_workspaces__workspace_id__meetings_post'
      responses:
        '201':
          description: The new meeting, queued for processing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeetingRead'
          headers:
            Location:
              description: URL of the meeting
              schema:
                type: string
                format: uri
        '400':
          description: '`MALFORMED_REQUEST`: invalid or repeated Content-Length header'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: '`UNAUTHENTICATED`: the session is missing, expired or ended'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: '`NOT_FOUND`: no such workspace, or the caller is not a member'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: '`PAYLOAD_TOO_LARGE`: the file is larger than 500 MiB or the
            multipart request exceeds 501 MiB'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '415':
          description: '`UNSUPPORTED_MEDIA_TYPE`: the content is not a supported audio
            format'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: '`VALIDATION_ERROR`: a parameter or field is invalid; `details`
            names each; `folder_id` must be a folder of this workspace'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/meetings/{meeting_id}/recording:
    get:
      tags:
      - meetings
      summary: Get a recording playback link
