[changelog]
header = """
# Changelog

All notable changes to Whadio are recorded here. The format follows
[Keep a Changelog](https://keepachangelog.com/en/1.1.0/), and versions follow
[Semantic Versioning](https://semver.org/spec/v2.0.0.html).
"""
body = """
{% if version -%}
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d", timezone="Europe/Kyiv") }}
{% else -%}
## [Unreleased]
{% endif -%}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits %}
- {% if commit.breaking %}**Breaking:** {% endif %}{{ commit.message | split(pat="\n") | first | trim | upper_first }}
{%- endfor %}
{% endfor %}"""
trim = false
postprocessors = [
  { pattern = '\(#([0-9]+)\)', replace = "([#${1}](https://github.com/ukma-fin-ssdm-2026/Whadio/pull/${1}))" },
]

[git]
conventional_commits = true
filter_unconventional = true
filter_commits = true
protect_breaking_commits = true
tag_pattern = "^v[0-9]+\\.[0-9]+\\.[0-9]+$"
sort_commits = "oldest"
commit_preprocessors = [
  { pattern = '\[REFACTOR\] ', replace = "" },
  # #267 was squash-merged under a title without its technique.
  { pattern = '^refactor\(#265\): replace trailing slash regex', replace = "refactor(#265): replace the trailing-slash regex with a backward scan (Substitute Algorithm)" },
]
# The HTML comments order the groups as Keep a Changelog does; the template strips them.
commit_parsers = [
  { message = '^chore\(#[0-9]+\): release ', skip = true },
  { message = "^feat", group = "<!-- 0 -->Added" },
  { message = "^(perf|revert)", group = "<!-- 1 -->Changed" },
  { message = "^fix", group = "<!-- 2 -->Fixed" },
  { message = "^refactor", group = "<!-- 3 -->Refactoring" },
  { message = ".*", skip = true },
]

[bump]
features_always_bump_minor = true
breaking_always_bump_major = false
