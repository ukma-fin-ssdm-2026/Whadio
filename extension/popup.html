<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Whadio</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <h1>Whadio</h1>

    <section id="not-meet" hidden>
      <p>Open a Google Meet call in this tab to record it.</p>
    </section>

    <section id="idle" hidden>
      <p>Tell everyone in the call that you are recording it, and record only once they agree.</p>
      <label>
        <input type="checkbox" id="consent" />
        Everyone in the call agreed to be recorded
      </label>
      <button id="start" disabled>Start recording</button>
    </section>

    <section id="recording" hidden>
      <p class="live">Recording <span id="elapsed">0:00</span></p>
      <button id="stop">Stop and save</button>
    </section>

    <p id="error" role="alert" hidden></p>

    <script src="popup.js" type="module"></script>
  </body>
</html>
