<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Whadio</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="card">
      <p class="brand">Whadio</p>

      <form id="sign-in" hidden>
        <h1>Sign in</h1>
        <p>Sign in to your Whadio server so recordings go to your workspace.</p>
        <label class="field">
          <input id="server" type="url" required value="http://localhost:3000" placeholder=" " />
          <span>Server</span>
        </label>
        <label class="field">
          <input id="email" type="email" required autocomplete="username" placeholder=" " />
          <span>Email</span>
        </label>
        <label class="field">
          <input id="password" type="password" required autocomplete="current-password" placeholder=" " />
          <span>Password</span>
        </label>
        <button type="submit">Sign in</button>
      </form>

      <section id="account" hidden>
        <p class="account">Signed in as <span id="name"></span> <button id="sign-out" type="button" class="link">Sign out</button></p>
        <label class="field">
          <select id="destination"></select>
          <span>Save recordings to</span>
        </label>
      </section>

      <section id="not-meet" hidden>
        <h1>No call here</h1>
        <p>Open a Google Meet call in this tab to record it.</p>
      </section>

      <section id="idle" hidden>
        <h1>Record this call</h1>
        <p class="notice">Tell everyone in the call that you are recording it, and record only once they agree.</p>
        <label class="check">
          <input type="checkbox" id="consent" />
          Everyone in the call agreed to be recorded
        </label>
        <button id="start" type="button" disabled>Start recording</button>
      </section>

      <section id="recording" hidden>
        <p class="live">Recording <span id="elapsed">0:00</span></p>
        <button id="stop" type="button">Stop and upload</button>
      </section>

      <p id="error" role="alert" hidden></p>
    </main>

    <script src="popup.js" type="module"></script>
  </body>
</html>
