name: CI/CD

# Branches get CI through their pull request; `workflow_dispatch` covers one without a pull request.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Every locked dependency ships a wheel, so no third-party build script runs in CI.
  UV_NO_BUILD: "1"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  changes:
    name: Detect code changes
    # GitHub-hosted: deciding what to run must not take one of the course's shared runners.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      code: ${{ steps.classify.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The pull request's merge base or the last commit CI tested on `main`, to diff against.
          fetch-depth: 0
          persist-credentials: false

      - name: Decide whether anything but documentation changed
        id: classify
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ github.token }}
          # Not the push's `before`: a newer push cancels a pending run on `main` before any of its
          # jobs, and a failed run may not have run them, so a push counts every commit since the
          # last green run.
          LAST_TESTED_COMMIT: >-
            first(.workflow_runs[]
            | select(.id != (env.GITHUB_RUN_ID | tonumber))
            | select(.event == "push" or .event == "workflow_dispatch")
            | select(.conclusion == "success")
            ).head_sha
        run: |
          # Whenever the changed files are unknown, everything runs.
          code=true
          range=""
          case "$EVENT" in
            pull_request) range="$PR_BASE...$PR_HEAD" ;;
            push)
              tested="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?branch=main&status=completed&per_page=100" --jq "$LAST_TESTED_COMMIT")" || tested=""
              if [ -n "$tested" ] && git merge-base --is-ancestor "$tested" "$GITHUB_SHA"; then
                range="$tested..$GITHUB_SHA"
              fi
              ;;
          esac
          echo "range=${range:-none}"
          changed="$RUNNER_TEMP/changed-files"
          if [ -n "$range" ] && git -c core.quotePath=false diff --name-only --no-renames "$range" > "$changed"; then
            code="$(python3 -I .github/scripts/code_changes.py < "$changed")" || code=true
          fi
          echo "code=$code" | tee -a "$GITHUB_OUTPUT"

  static:
    name: Static checks and audit
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The whole history, for the history-wide secret scan.
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Install dependencies
        run: uv sync --locked --extra asr --extra cpu

      - name: Cache pre-commit environments
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml', '.python-version') }}

      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install the frontend dependencies
        run: npm ci --prefix frontend --ignore-scripts

      - name: Run every static check on all files
        run: uv run --frozen task check

      - name: Audit the dependencies
        if: ${{ !cancelled() }}
        run: uv run --frozen task audit

      - name: Package the Chrome extension
        id: extension
        run: |
          archive="$(.venv/bin/python -I .github/scripts/package_extension.py extension .)"
          echo "archive=${archive}" >> "$GITHUB_OUTPUT"

      - name: Upload the Chrome extension
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ${{ steps.extension.outputs.archive }}
          archive: false
          retention-days: 30

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/api

  frontend:
    name: Frontend
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Install dependencies
        run: uv sync --locked

      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install the frontend dependencies
        run: npm ci --prefix frontend --ignore-scripts

      - name: Check the types
        run: uv run --frozen task frontend:typecheck

      - name: Run the tests
        if: ${{ !cancelled() }}
        run: uv run --frozen task frontend:test

      - name: Run the extension's tests
        if: ${{ !cancelled() }}
        run: uv run --frozen task extension:test

      - name: Build
        if: ${{ !cancelled() }}
        run: uv run --frozen task frontend:build

  backend:
    name: Backend tests and coverage
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Install dependencies
        run: uv sync --locked --extra asr --extra cpu

      # The fast suite alone stays below fail_under, so pull requests report its coverage ungated.
      - name: Run the fast suite
        id: fast
        if: github.event_name == 'pull_request'
        run: |
          # `--cov` takes an optional source, so it goes last or it swallows the next argument.
          uv run --frozen task test:fast -- \
            --junitxml=reports/junit.xml \
            --cov-report=term-missing:skip-covered \
            --cov-report=html \
            --cov-fail-under=0 \
            --cov

      - name: Start the services and migrate the test database
        if: github.event_name != 'pull_request'
        env:
          WHADIO_DB_HOST: 127.0.0.1
        run: |
          cp .env.example .env
          uv run --frozen task infra:up
          uv run --frozen task db:upgrade
          uv run --frozen alembic check

      # CI has no downloaded ML models; the tests that need them run locally.
      - name: Run the whole test suite with the coverage gate
        id: whole
        if: github.event_name != 'pull_request'
        env:
          WHADIO_DB_HOST: 127.0.0.1
        run: |
          # Compose created the whadio_app role from .env, so the URL, password included, comes from there too.
          WHADIO_TEST_DATABASE_URL="$(uv run --frozen python -I -c 'from whadio.shared.database import DatabaseSettings; print(DatabaseSettings().application_url().render_as_string(False))')"
          export WHADIO_TEST_DATABASE_URL
          uv run --frozen task test:cov -- \
            --junitxml=reports/junit.xml \
            --cov-report=term-missing:skip-covered \
            --cov-report=html

      - name: Summarise the suite, failed tests and coverage
        if: ${{ !cancelled() && (steps.fast.outcome != 'skipped' || steps.whole.outcome != 'skipped') }}
        env:
          SUITE: ${{ steps.fast.outcome != 'skipped' && 'Fast suite' || 'Whole suite' }}
        run: |
          {
            uv run --frozen python -I .github/scripts/junit_summary.py reports/junit.xml "$SUITE" ||
              printf '### %s\n\nTest report unavailable.\n' "$SUITE"
            echo
            echo "### $SUITE coverage (line and branch)"
            echo
            uv run --frozen coverage report --format=markdown --fail-under=0 ||
              echo "Coverage report unavailable."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the test and coverage reports
        if: ${{ !cancelled() && (steps.fast.outcome != 'skipped' || steps.whole.outcome != 'skipped') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports
          path: |
            reports/
            htmlcov-ci/
          retention-days: 14

  reliability:
    name: Reliability tests
    needs: changes
    if: github.event_name != 'pull_request' && needs.changes.outputs.code == 'true'
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      # No extras: selecting by path leaves out the ASR tests, which import the ML packages.
      - name: Install dependencies
        run: uv sync --locked

      - name: Start PostgreSQL and migrate the test database
        env:
          WHADIO_DB_HOST: 127.0.0.1
        run: |
          cp .env.example .env
          docker compose up --detach --wait postgres
          uv run --frozen task db:upgrade

      - name: Run the reliability tests
        env:
          WHADIO_DB_HOST: 127.0.0.1
        run: |
          WHADIO_TEST_DATABASE_URL="$(uv run --frozen python -I -c 'from whadio.shared.database import DatabaseSettings; print(DatabaseSettings().application_url().render_as_string(False))')"
          export WHADIO_TEST_DATABASE_URL
          uv run --frozen task test:reliability

  image:
    name: Worker image
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Install dependencies
        run: uv sync --locked

      - name: Build the worker image and run its entry point
        run: uv run --frozen task image

  ci-passed:
    name: CI passed
    needs: [changes, static, frontend, backend, reliability, image]
    # This is the required check: GitHub counts a skipped job as passed, so it must never skip.
    if: always()
    runs-on: [self-hosted, linux]
    steps:
      - name: Require every job to have succeeded, or to have been skipped by design
        env:
          CHANGES: ${{ needs.changes.result }}
          STATIC: ${{ needs.static.result }}
          FRONTEND: ${{ needs.frontend.result }}
          BACKEND: ${{ needs.backend.result }}
          RELIABILITY: ${{ needs.reliability.result }}
          IMAGE: ${{ needs.image.result }}
          # A change to documentation alone skips the jobs that build and test code.
          CODE: ${{ needs.changes.outputs.code != 'false' }}
          RELIABILITY_RUNS: ${{ needs.changes.outputs.code != 'false' && github.event_name != 'pull_request' }}
        run: |
          failed=0
          expect() {
            local job="$1" result="$2" runs="$3" expected=skipped
            [ "$runs" = true ] && expected=success
            echo "$job: $result, expected $expected"
            [ "$result" = "$expected" ] || failed=1
          }
          expect "Detect code changes" "$CHANGES" true
          expect "Static checks and audit" "$STATIC" true
          expect "Frontend" "$FRONTEND" "$CODE"
          expect "Backend tests and coverage" "$BACKEND" "$CODE"
          expect "Reliability tests" "$RELIABILITY" "$RELIABILITY_RUNS"
          expect "Worker image" "$IMAGE" "$CODE"
          exit "$failed"

  deploy:
    name: Deploy to GitHub Pages
    needs: ci-passed
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    runs-on: [self-hosted, linux]
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
