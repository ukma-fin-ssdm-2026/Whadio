name: CI
on:
  push:
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v6
      - name: Install dependencies
        run: uv sync --locked
      - name: Generate OpenAPI specification
        run: uv run python -m src.api.openapi_export
      - name: Check generated files
        run: git diff --exit-code -- docs/api/openapi-generated.json
