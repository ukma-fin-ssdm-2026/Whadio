name: CI/CD

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify:
    name: Checks, tests and API contract
    runs-on: [self-hosted, linux]
    env:
      # Pushes to main check out main itself; the hook exists to stop local commits there.
      SKIP: no-commit-to-branch
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The whole history, for the history-wide secret scan.
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Install dependencies
        run: uv sync --locked --extra asr --extra cpu

      - name: Cache pre-commit environments
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml', '.python-version') }}

      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install the frontend dependencies
        run: npm ci --prefix frontend --ignore-scripts

      - name: Run the commit-hook checks on all files
        run: uv run --frozen task check

      - name: Build the frontend
        run: npm --prefix frontend run build

      - name: Start the services and migrate the test database
        env:
          WHADIO_DB_HOST: 127.0.0.1
        run: |
          cp .env.example .env
          uv run --frozen task infra:up
          uv run --frozen task db:upgrade
          uv run --frozen alembic check

      # CI has no downloaded ML models; the tests that need them run locally.
      - name: Run the whole test suite with the coverage gate
        id: tests
        env:
          WHADIO_TEST_DATABASE_URL: postgresql+psycopg://whadio_app:whadio-dev-app@127.0.0.1:5432/whadio
        run: >-
          uv run --frozen task test:cov --
          --junitxml=reports/junit.xml
          --cov-report=term-missing:skip-covered
          --cov-report=html

      - name: Summarise coverage and failed tests
        if: ${{ !cancelled() && steps.tests.outcome != 'skipped' }}
        run: |
          {
            echo "### Coverage (line and branch)"
            echo
            uv run --frozen coverage report --format=markdown --fail-under=0 ||
              echo "Coverage report unavailable."
            echo
            uv run --frozen python -I .github/scripts/junit_failures.py reports/junit.xml ||
              printf '### Failed tests\n\nTest report unavailable.\n'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the test and coverage reports
        if: ${{ !cancelled() && steps.tests.outcome != 'skipped' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports
          path: |
            reports/
            htmlcov-ci/
          retention-days: 14

      - name: Audit dependencies and the git history
        run: uv run --frozen task audit

      # Only the CPU variant: TORCH=cuda adds about 3.5 GB of CUDA wheels to every cold build.
      - name: Build the worker image and run its entry point
        run: |
          tag="whadio:ci-${GITHUB_RUN_ID}"
          trap 'docker image rm --force "$tag" > /dev/null' EXIT
          docker build --build-arg TORCH=cpu --tag "$tag" .
          docker run --rm "$tag" --help

      - name: Lint OpenAPI specification
        run: npx --yes @redocly/cli@2.55.0 lint docs/api/openapi-generated.yaml

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/api

  deploy:
    name: Deploy to GitHub Pages
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    runs-on: [self-hosted, linux]
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
