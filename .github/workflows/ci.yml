name: CI/CD

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify:
    name: Checks, tests and API contract
    runs-on: ubuntu-latest
    env:
      # Pushes to main check out main itself; the hook exists to stop local commits there.
      SKIP: no-commit-to-branch
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The whole history, for the history-wide secret scan.
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Install dependencies
        run: uv sync --locked

      - name: Cache pre-commit environments
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml', '.python-version') }}

      - name: Run the commit-hook checks on all files
        run: uv run --frozen task check

      - name: Start and migrate the disposable test database
        env:
          WHADIO_DB_HOST: 127.0.0.1
        run: |
          cp .env.example .env
          docker compose --profile core up --detach --wait postgres
          uv run --frozen task db:upgrade
          uv run --frozen alembic check

      - name: Run the whole test suite
        env:
          WHADIO_TEST_DATABASE_URL: postgresql+psycopg://whadio_app:whadio-dev-app@127.0.0.1:5432/whadio
        run: uv run --frozen task test

      - name: Audit dependencies and the git history
        run: uv run --frozen task audit

      - name: Lint OpenAPI specification
        run: npx --yes @redocly/cli@2.55.0 lint docs/api/openapi-generated.yaml

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: docs/api

  deploy:
    name: Deploy to GitHub Pages
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
