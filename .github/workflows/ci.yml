name: CI/CD

# Branches get CI through their pull request; `workflow_dispatch` covers one without a pull request.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Every locked dependency ships a wheel, so no third-party build script runs in CI.
  UV_NO_BUILD: "1"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  static:
    name: Static checks and audit
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The whole history, for the history-wide secret scan.
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Install dependencies
        run: uv sync --locked --extra asr --extra cpu

      - name: Cache pre-commit environments
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml', '.python-version') }}

      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install the frontend dependencies
        run: npm ci --prefix frontend --ignore-scripts

      - name: Run every static check on all files
        run: uv run --frozen task check

      - name: Audit the dependencies
        if: ${{ !cancelled() }}
        run: uv run --frozen task audit

      - name: Package the Chrome extension
        id: extension
        run: |
          archive="$(.venv/bin/python -I .github/scripts/package_extension.py extension .)"
          echo "archive=${archive}" >> "$GITHUB_OUTPUT"

      - name: Upload the Chrome extension
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ${{ steps.extension.outputs.archive }}
          archive: false
          retention-days: 30

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/api

  frontend:
    name: Frontend
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Install dependencies
        run: uv sync --locked

      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install the frontend dependencies
        run: npm ci --prefix frontend --ignore-scripts

      - name: Check the types
        run: uv run --frozen task frontend:typecheck

      - name: Run the tests
        if: ${{ !cancelled() }}
        run: uv run --frozen task frontend:test

      - name: Build
        if: ${{ !cancelled() }}
        run: uv run --frozen task frontend:build

  backend:
    name: Backend tests and coverage
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Install dependencies
        run: uv sync --locked --extra asr --extra cpu

      - name: Start the services and migrate the test database
        env:
          WHADIO_DB_HOST: 127.0.0.1
        run: |
          cp .env.example .env
          uv run --frozen task infra:up
          uv run --frozen task db:upgrade
          uv run --frozen alembic check

      # CI has no downloaded ML models; the tests that need them run locally.
      - name: Run the whole test suite with the coverage gate
        id: tests
        env:
          WHADIO_TEST_DATABASE_URL: postgresql+psycopg://whadio_app:whadio-dev-app@127.0.0.1:5432/whadio
        run: >-
          uv run --frozen task test:cov --
          --junitxml=reports/junit.xml
          --cov-report=term-missing:skip-covered
          --cov-report=html

      - name: Summarise coverage and failed tests
        if: ${{ !cancelled() && steps.tests.outcome != 'skipped' }}
        run: |
          {
            echo "### Coverage (line and branch)"
            echo
            uv run --frozen coverage report --format=markdown --fail-under=0 ||
              echo "Coverage report unavailable."
            echo
            uv run --frozen python -I .github/scripts/junit_failures.py reports/junit.xml ||
              printf '### Failed tests\n\nTest report unavailable.\n'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the test and coverage reports
        if: ${{ !cancelled() && steps.tests.outcome != 'skipped' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports
          path: |
            reports/
            htmlcov-ci/
          retention-days: 14

  image:
    name: Worker image
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Install dependencies
        run: uv sync --locked

      - name: Build the worker image and run its entry point
        run: uv run --frozen task image

  ci-passed:
    name: CI passed
    needs: [static, frontend, backend, image]
    # This is the required check: GitHub counts a skipped job as passed, so it must never skip.
    if: always()
    runs-on: [self-hosted, linux]
    steps:
      - name: Require every job to have succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          for result in $RESULTS; do
            [ "$result" = success ] || exit 1
          done

  deploy:
    name: Deploy to GitHub Pages
    needs: ci-passed
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    runs-on: [self-hosted, linux]
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
