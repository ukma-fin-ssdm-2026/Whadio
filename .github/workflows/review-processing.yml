name: Review processing

# Restrict the review-processing environment to main and configure REVIEW_PROCESSING_STATE_KEY.
# Keep the key stable so the processor can read signed decisions and delivery state.
# Submit approval and nits together. Changes after inspection can race with merging.

on:
  pull_request_target:
    branches: [main]
    types: [opened, reopened, closed, synchronize, ready_for_review, converted_to_draft, edited, auto_merge_enabled]
  workflow_run:
    workflows: [Review signal]
    types: [completed]
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:
    inputs:
      pull_request:
        description: Pull request number to reconcile
        required: false
        type: number

permissions: {}

jobs:
  inventory:
    # SonarCloud S7631 requires the same-repository guard before checkout.
    if: >-
      github.ref == 'refs/heads/main'
      && (github.event_name != 'workflow_run'
        || (github.event.workflow_run.head_repository.full_name == github.repository
          && github.event.workflow_run.pull_requests[0].number != null))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
      pull-requests: read
    outputs:
      targets: ${{ steps.targets.outputs.pull_requests }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Find pull requests to process
        id: targets
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REVIEW_PROCESSING_TEST_PR: ${{ vars.REVIEW_PROCESSING_TEST_PR }}
        run: python3 -I .github/scripts/review_processing.py --inventory

  process:
    needs: inventory
    if: >-
      github.ref == 'refs/heads/main'
      && (github.event_name != 'workflow_run'
        || (github.event.workflow_run.head_repository.full_name == github.repository
          && github.event.workflow_run.pull_requests[0].number != null))
      && needs.inventory.outputs.targets != '[]'
    strategy:
      fail-fast: false
      matrix:
        pull_request: ${{ fromJSON(needs.inventory.outputs.targets) }}
    concurrency:
      group: review-processing-${{ matrix.pull_request }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    environment: review-processing
    timeout-minutes: 5
    defaults:
      run:
        shell: bash
    permissions:
      contents: read
      issues: read
      pull-requests: write
      statuses: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # github.sha identifies the main commit for the guarded triggers.
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Process current reviews
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REVIEW_PROCESSING_TARGET: ${{ matrix.pull_request }}
          REVIEW_PROCESSING_STATE_KEY: ${{ secrets.REVIEW_PROCESSING_STATE_KEY }}
          REVIEW_PROCESSING_TEST_PR: ${{ vars.REVIEW_PROCESSING_TEST_PR }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 -I .github/scripts/review_processing.py
