name: Review processing

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft, edited, auto_merge_enabled]
  workflow_run:
    workflows: [Review signal]
    types: [completed]
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

# Each run reconciles all open PRs, so coalescing queued events cannot lose a review.
concurrency:
  group: review-processing
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
      statuses: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/heads/main
          persist-credentials: false
      - name: Process current reviews
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REVIEW_PROCESSING_ENABLED: ${{ vars.REVIEW_PROCESSING_ENABLED }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 -I .github/scripts/review_processing.py
