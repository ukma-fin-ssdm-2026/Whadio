name: Review processing

# Before merging, restrict the review-processing environment to main and store
# a random REVIEW_PROCESSING_STATE_KEY of at least 32 characters there.
# Keep the key stable so the processor can read signed decisions and delivery state.
# Confirm TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT_ID are configured.
# Set REVIEW_PROCESSING_TEST_PR to limit processing to one PR during rollout.
# Require Review processed from GitHub Actions in a separate main ruleset with
# only the release app as a PR bypass actor. Keep the existing approval and CI rules.
# Verify cancellation, Telegram delivery and the release workflow before removing the test scope.
# Submit approval and nits together. Changes after inspection can race with merging.

on:
  pull_request_target:
    branches: [main]
    types: [opened, reopened, closed, synchronize, ready_for_review, converted_to_draft, edited, auto_merge_enabled]
  workflow_run:
    workflows: [Review signal]
    types: [completed]
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
    inputs:
      pull_request:
        description: Pull request number to reconcile
        required: false
        type: number

permissions: {}

jobs:
  process:
    # SonarCloud S7631 requires the same-repository guard before checkout.
    if: >-
      github.ref == 'refs/heads/main'
      && (github.event_name != 'workflow_run'
        || (github.event.workflow_run.head_repository.full_name == github.repository
          && github.event.workflow_run.pull_requests[0].number != null))
    concurrency:
      group: review-processing
      cancel-in-progress: false
    runs-on: ubuntu-latest
    environment: review-processing
    timeout-minutes: 5
    defaults:
      run:
        shell: bash
    permissions:
      contents: read
      issues: read
      pull-requests: write
      statuses: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # github.sha identifies the main commit for the guarded triggers.
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Process current reviews
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REVIEW_PROCESSING_STATE_KEY: ${{ secrets.REVIEW_PROCESSING_STATE_KEY }}
          REVIEW_PROCESSING_TEST_PR: ${{ vars.REVIEW_PROCESSING_TEST_PR }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 -I .github/scripts/review_processing.py
