name: Commit messages

on:
  pull_request:
    # `edited` re-checks the title after a rename.
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

env:
  # Every locked dependency ships a wheel, so no third-party build script runs in CI.
  UV_NO_BUILD: "1"

concurrency:
  group: commit-messages-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  commit-messages:
    name: Pull request title and commit messages
    runs-on: [self-hosted, linux]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Install dependencies
        run: uv sync --locked

      # A squash merge lands the title on main, a rebase or merge commit lands every commit.
      - name: Check them with the commit-msg hook
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          messages="$RUNNER_TEMP/messages"
          mkdir "$messages"
          printf '%s\n' "$TITLE" > "$messages/title"
          git rev-list "$BASE_SHA..$HEAD_SHA" | while read -r sha; do
            git log -1 --format=%B "$sha" > "$messages/commit-$sha"
          done
          status=0
          for message in "$messages"/*; do
            uv run --frozen pre-commit run commit-msg-format --hook-stage commit-msg \
              --commit-msg-filename "$message" || status=1
          done
          exit "$status"
