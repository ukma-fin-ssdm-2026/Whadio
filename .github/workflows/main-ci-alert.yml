name: Main CI alert

on:
  workflow_run:
    workflows: [CI/CD]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  notify:
    name: Notify the team of a failed main run
    # SonarCloud S7631 requires the same-repository guard before checkout.
    if: >-
      github.event.workflow_run.conclusion == 'failure'
      && github.event.workflow_run.head_repository.full_name == github.repository
      && (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # For workflow_run, github.sha identifies the default-branch commit.
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Post the failed run link to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 -I .github/scripts/main_ci_alert.py
