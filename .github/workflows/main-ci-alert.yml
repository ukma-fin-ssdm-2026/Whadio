name: Main CI alert

on:
  workflow_run:
    workflows: [CI/CD]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  notify:
    name: Notify the team of a failed main run
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # workflow_run can carry fork-controlled data; execute only trusted default-branch code.
          ref: main
          persist-credentials: false

      - name: Post the failed run link to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 -I .github/scripts/main_ci_alert.py
