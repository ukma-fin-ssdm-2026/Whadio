version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
      include: scope
    groups:
      dev-tools:
        dependency-type: development
      runtime:
        dependency-type: production
        update-types: [minor, patch]
    ignore:
      # Dependabot reads PyPI, but pyproject.toml takes these from the PyTorch indexes, which lag
      # it, and the three must stay one matched build set: bump them together by hand.
      - dependency-name: torch
      - dependency-name: torchaudio
      - dependency-name: torchcodec

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
      include: scope
    groups:
      frontend:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      # Its major follows the Node runtime in frontend/.nvmrc and moves with it by hand.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
      include: scope
    groups:
      hooks:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
      include: scope
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
      include: scope
    groups:
      images:
        patterns: ["*"]
